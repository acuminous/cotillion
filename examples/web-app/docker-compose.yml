services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cotillion
      POSTGRES_PASSWORD: cotillion
      POSTGRES_DB: cotillion
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotillion"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
